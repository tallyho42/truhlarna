.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:14px;align-items:start}
.fig{background:var(--fig);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:6px;color:#222326}
.fig.wide{grid-column:1/-1}
.fig.el{grid-column:1/-1}

.body{display:grid;gap:14px}
ol.do{margin:0;padding-left:1.4em;display:grid;gap:10px;max-width:80ch}

ul{margin:0;padding-left:1.1em;display:grid;gap:4px}
.note{background:var(--warn-bg);color:var(--warn-ink);border-radius:10px;padding:12px 14px;font-size:.95rem;max-width:80ch}
.parts{display:grid;gap:10px}

th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:top}

.loc{display:grid;gap:8px}

.pager button:disabled{opacity:.4;cursor:default}
.pager button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

// generic level steps
const levels=Object.keys(byGroup).map(Number).sort((a,b)=>a-b).filter(g=>g>0);
const levelTitles={3:"Levý bok a police nad křeslem",6:"Most nad dveřmi a horní řada",7:"Horní deska"};
levels.forEach(g=>{
  const ids=byGroup[g].filter(id=>!["K01","K02","K03","K04"].includes(id));
  if(!ids.length)return;
  const range=ids.length>1?ids[0]+"–"+ids[ids.length-1]:ids[0];
  const title=(levelTitles[g]?levelTitles[g]+": ":"Police a příčky ")+ids.join(", ");
  add(levelTitles[g]||range,title,()=>{
    const j=jointsIn(ids);
    let figs=fig(elev(ids).outerHTML,"Tento krok: "+ids.join(", ")+".","el");
    if(ids.includes("K20")||ids.some(id=>/Dno mostu/.test(PBY[id].name)))figs+=figBridge();
    if(ids.includes("K26"))figs+=figTop();
    if(j.pins)figs+=FIG.pins();
    if(j.screw)figs+=FIG.screwA();
    if(j.stacked)figs+=FIG.stacked();
    if(j.angleTop&&!ids.includes("K26"))figs+=FIG.angle();
    const shelves=ids.filter(id=>PBY[id].o==="H"), verts=ids.filter(id=>PBY[id].o==="V");
    let steps=[];
    if(ids.includes("K09"))steps.push("<b>Nejdřív levý bok K09:</b> přilož k obkladu, spodní konec ve výšce "+nf(PBY.K09.z0)+" mm nad podlahou (podlož ho dvěma kousky latě na zemi), čelo do roviny s K02 (dlouhá lať přes obě čela). Přišroubuj 6–8 dlouhými vruty přes obklad do dřevěné stěny, hlavy zapustit, ať nepřekáží policím.");
    if(ids.includes("K20"))steps.push("<b>Boční díl mostu K20</b> přišroubuj do pravé stěny (sádrokarton, kovové hmoždinky, ideálně do profilu), spodní konec ve výšce "+nf(PBY.K20.z0)+" mm, čelo v rovině s K04. Díry pro podpěrky už má z dílny.");
    if(ids.some(id=>/Dno mostu/.test(PBY[id].name)))steps.push("<b>Nosiče mostu:</b> 2 skryté nosiče přes sádrokarton do dřeva, přesně ve výšce spodní plochy dna mostu. Do zadní hrany dna vyvrtej díry pro trny (stejné rozteče jako nosiče, přenes je přiložením).");
    if(shelves.length)steps.push("<b>Police</b> "+shelves.join(", ")+": zasuň podpěrky do připravených děr a polici zasuň zepředu. Čelo srovnej s čely sousedních dílů. Zezadu ji přichyť malým úhelníkem do zdi.");
    verts.filter(id=>id!=="K09"&&id!=="K20").forEach(id=>{const p=PBY[id];
      if(/pod ní je další příčka/.test(p.ends[0]))steps.push("<b>"+id+"</b> postav na "+/na (K\d+)/.exec(p.ends[0])[1]+" přesně nad příčku pod ní, čelo k lati, a přichyť <b>úhelníkem vzadu</b> v přihrádce.");
      else if(/zespodu/.test(p.ends[0]))steps.push("<b>"+id+"</b> postav na "+/na (K\d+)/.exec(p.ends[0])[1]+", čelo k lati, stáhni svěrkou a <b>zespodu přes polici</b> předvrtej a zašroubuj 2 vruty (spoj A).");
      if(/shora/.test(p.ends[1]))steps.push("Až bude nad "+id+" ležet "+/pod (K\d+)/.exec(p.ends[1])[1]+", zašroubuj ji <b>shora skrz polici</b> do "+id+" (spoj A).");
      if(/úhelník vzadu/.test(p.ends[1]))steps.push(id+" nahoře přichyť úhelníkem do zadní stěny (přes sádrokarton do dřeva).");
    });
    if(ids.includes("K26"))steps.push("<b>Horní deska K26</b> jako poslední: zasuň zepředu přes hotové svislé díly, vlevo dolehne na K09, vpravo na podpěrky v K20. Zespodu přichyť úhelníky u zadní hrany ke všem svislým dílům pod ní.");
    steps.push("Kontrola: čela v jedné rovině (lať přes celou šířku), přihrádky pravoúhlé (úhlopříčky stejné).");
    return '<div class="figs">'+figs+'</div><ol class="do">'+steps.map(s=>'<li>'+s+'</li>').join("")+'</ol><div class="parts">'+ids.map(id=>partCard(PBY[id])).join("")+'</div>';
  });
});

/* ---------- stock drawings ---------- */
function stockOverview(S){
  const sc=.12, gap=44; let x=10, y=20, rowH=0, maxW=1180, s='';
  const list=S.slice().sort((a,b)=>LOC_ORDER.indexOf(a.loc)-LOC_ORDER.indexOf(b.loc)||b.L*b.Wd-a.L*a.Wd);
  list.forEach(st=>{
    const w=st.L*sc, h=st.Wd*sc;
    if(x+w>maxW){x=10;y+=rowH+34;rowH=0;}
    s+='<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+(LOC[st.loc]||"#E4C896")+'" stroke="#6B5536" stroke-width="1"/>'+
      T(x,y+h+14,st.id+" · "+nf(st.L)+"×"+nf(st.Wd),{fs:12});
    const items=st.strips.flatMap(q=>q.items);
    s+=T(x+4,y+13,items.join(" "),{fs:11,fill:"#2B2118"});
    x+=w+gap; rowH=Math.max(rowH,h);
  });
  return svgw("0 0 "+(maxW+20)+" "+(y+rowH+30),s,"Desky z půdy v měřítku");
}
function cutPlans(){
  const S=Object.values(DATA.stock).sort((a,b)=>LOC_ORDER.indexOf(a.loc)-LOC_ORDER.indexOf(b.loc)||a.id.localeCompare(b.id,"cs",{numeric:true}));
  const sc=.27;
  return S.map(s=>{
    const pad=16, top=46, vw=s.L+2*pad, vh=s.Wd+top+pad, hid="h"+s.id.replace(/\W/g,"");
    let g='<defs><pattern id="'+hid+'" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="18" stroke="#C9B38E" stroke-width="3"/></pattern></defs>'+
      '<rect x="0" y="0" width="'+s.L+'" height="'+s.Wd+'" fill="#F3E6CF"/><rect x="0" y="0" width="'+s.L+'" height="'+s.Wd+'" fill="url(#'+hid+')"/><rect x="0" y="0" width="'+s.L+'" height="'+s.Wd+'" fill="none" stroke="#9C7A48" stroke-width="3"/>'+
      '<text x="0" y="-14" font-family="'+LBL+'" font-size="44" fill="#65686C">léta ⟷</text>';
    s.strips.forEach(st=>st.items.forEach(pid=>{const p=PBY[pid], w=p.cutL||p.L, h=p.cutB||p.B, x=p.off, y=st.y;
      const fs=Math.min(58,Math.max(28,Math.min(h,w)*.24)), fd=Math.min(46,Math.max(26,Math.min(h,w)*.19));
      g+='<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+(LOC[s.loc]||"#E4C896")+'" stroke="#6B5536" stroke-width="3"/>';
      for(let k=1;k<4;k++)g+='<line x1="'+(x+8)+'" x2="'+(x+w-8)+'" y1="'+(y+h*k/4)+'" y2="'+(y+h*k/4)+'" stroke="#6B5536" stroke-opacity=".18" stroke-width="3"/>';
      // délka (po letech) u horní hrany, šířka u levé hrany
      g+='<text x="'+(x+w/2)+'" y="'+(y+fd+6)+'" text-anchor="middle" font-family="'+LBL+'" font-size="'+fd+'" fill="#2B2118" stroke="#FBFAF7" stroke-width="7" paint-order="stroke">'+nf(w)+'</text>';
      const lx=x+fd*.9+6, ly=y+h/2;
      g+='<text x="'+lx+'" y="'+ly+'" text-anchor="middle" font-family="'+LBL+'" font-size="'+fd+'" fill="#2B2118" stroke="#FBFAF7" stroke-width="7" paint-order="stroke" transform="rotate(-90 '+lx+' '+ly+')">'+nf(h)+'</text>';
      g+='<text x="'+(x+w/2+fd*.4)+'" y="'+(y+h/2+fs*.55)+'" text-anchor="middle" font-family="'+LBL+'" font-size="'+fs+'" font-weight="600" fill="#2B2118">'+pid+'</text>';}));
    return '<div class="sk"><div class="h"><b>'+esc(s.id)+'</b> '+nf(s.L)+' × '+nf(s.Wd)+(s.vady?' · '+esc(s.vady):'')+'</div><svg viewBox="'+(-pad)+' '+(-top)+' '+vw+' '+vh+'" width="'+Math.round(vw*sc)+'" height="'+Math.round(vh*sc)+'" role="img" aria-label="Plán řezu '+esc(s.id)+'">'+g+'</svg></div>';
  }).join("");
}

/* ---------- navigation ---------- */
const nav=document.getElementById("nav"), main=document.getElementById("step");
let cur=0;
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(e){return null;}}
nav.innerHTML=STEPS.map((s,i)=>'<button type="button" data-i="'+i+'"><b>'+(i+1)+'</b>'+esc(s.short)+'</button>').join("");
function show(i,focus){
  cur=Math.max(0,Math.min(STEPS.length-1,i));
  const s=STEPS[cur];
  main.innerHTML='<div class="stephead"><div class="eyebrow">Krok '+(cur+1)+' z '+STEPS.length+'</div><h2>'+esc(s.title)+'</h2></div>'+s.render();
  nav.querySelectorAll("button").forEach((b,k)=>{b.toggleAttribute("aria-current",k===cur);if(k===cur)b.setAttribute("aria-current","step");b.classList.toggle("done",k<cur);});
  const b=nav.querySelector('[data-i="'+cur+'"]'); if(b&&b.scrollIntoView)b.scrollIntoView({block:"nearest",inline:"center"});
  document.getElementById("prev").disabled=cur===0; document.getElementById("next").disabled=cur===STEPS.length-1;
  document.getElementById("prev").textContent=cur>0?"← "+(cur)+". "+STEPS[cur-1].short:"← Předchozí";
  document.getElementById("next").textContent=cur<STEPS.length-1?(cur+2)+". "+STEPS[cur+1].short+" →":"Další →";
  if(location.hash!=="#krok-"+(cur+1))history.replaceState(null,"","#krok-"+(cur+1));
  store("postup-krok",String(cur));
  main.querySelectorAll("input[type=checkbox][data-k]").forEach(c=>{c.checked=store(c.dataset.k)==="1";c.closest("label").classList.toggle("on",c.checked);
    c.addEventListener("change",()=>{store(c.dataset.k,c.checked?"1":"0");c.closest("label").classList.toggle("on",c.checked);});});
  if(focus){window.scrollTo({top:0});main.focus({preventScroll:true});}
}
nav.addEventListener("click",e=>{const b=e.target.closest("button[data-i]");if(b)show(+b.dataset.i,true);});
document.getElementById("prev").addEventListener("click",()=>show(cur-1,true));
document.getElementById("next").addEventListener("click",()=>show(cur+1,true));
document.addEventListener("keydown",e=>{if(e.target.closest("input,textarea"))return;if(e.key==="ArrowRight")show(cur+1,true);if(e.key==="ArrowLeft")show(cur-1,true);});
const m=/#krok-(\d+)/.exec(location.hash);
show(m?+m[1]-1:(+store("postup-krok")||0),false);
})();
</script>
