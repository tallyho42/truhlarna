}

}

h1{font-size:clamp(1.8rem,4.5vw,2.8rem);font-weight:700;letter-spacing:-.02em}

.stephead{display:grid;gap:6px}
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:14px;align-items:start}
.fig{background:var(--fig);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:6px;color:#222326}
.fig.wide{grid-column:1/-1}

.fig.el svg{max-height:640px;width:auto;max-width:100%;margin:0 auto}
.fig svg{display:block;width:100%;height:auto}
.fig .cap{font-size:.85rem;color:#65686C}
.body{display:grid;gap:14px}
ol.do{margin:0;padding-left:1.4em;display:grid;gap:10px;max-width:80ch}
ol.do li::marker{font-family:var(--label);font-weight:600;color:var(--accent)}
ul{margin:0;padding-left:1.1em;display:grid;gap:4px}
.note{background:var(--warn-bg);color:var(--warn-ink);border-radius:10px;padding:12px 14px;font-size:.95rem;max-width:80ch}
.parts{display:grid;gap:10px}
.part{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--cur);border-radius:10px;padding:10px 14px;display:grid;gap:3px;font-size:.94rem}
.part .t{font-family:var(--label);font-size:1.1rem;font-weight:600;letter-spacing:.02em}
.part .k{color:var(--muted)}
table{border-collapse:collapse;width:100%;font-size:.93rem;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--label);text-transform:uppercase;letter-spacing:.08em;font-size:.8rem;color:var(--muted);font-weight:600}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.loc{display:grid;gap:8px}
.loc h3{display:flex;gap:8px;align-items:center}
.loc h3 i{width:12px;height:12px;border-radius:3px;display:inline-block}
label.chk{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer}
label.chk input{margin-top:5px;width:18px;height:18px;accent-color:var(--ok)}
label.chk b{font-family:var(--label);font-size:1.05rem}
label.chk.on{background:var(--ok-soft)}
.stocks{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}
.sk{background:var(--fig);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:6px;max-width:100%;color:#222326}
.sk .h{font-size:.88rem}
.sk .h b{font-family:var(--label);font-size:1.02rem}
.sk svg{display:block;max-width:100%;height:auto}
.pager{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.pager button{font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 16px;cursor:pointer;max-width:48%}
.pager button:disabled{opacity:.4;cursor:default}
.pager button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  const holes=pinHoles(p.id,face), e=face===0?KO.edge_r:KO.edge_l, sx=HF.w/D, sl=Lpx/p.L, bot=top+Lpx;
  const xs=[x+e*sx,x+HF.w-e*sx], cx=x+HF.w/2;
  let s='<rect x="'+x+'" y="'+top+'" width="'+HF.w+'" height="'+Lpx+'" '+WOOD2+'/>';
  s+=T(cx,top-44,face===0?"pravá strana":"levá strana",{anchor:"middle",fs:16,w:1});
  s+=T(cx,top-26,"kolíky "+e+" mm od hran",{anchor:"middle",fs:13});
  s+=T(x,top-6,face===0?"čelo":"zeď",{fs:12,fill:"#6B4A2E"})+T(x+HF.w,top-6,face===0?"zeď":"čelo",{fs:12,fill:"#6B4A2E",anchor:"end"});
  holes.forEach((j,i)=>{
    const y=bot-j.hole*sl;
    s+=hc(xs[0],y,4)+hc(xs[1],y,4);
    const dx=face===1?x-14-i*HF.step:x+HF.w+22+i*HF.step, near=face===1?xs[0]:xs[1];
    s+=lnD(near,y,dx,y)+vdim(dx,bot,y,nf(j.hole));
  });
  // vzdálenost od bližší hrany
  if(holes.length){s+=lnD(xs[0],bot,xs[0],bot+24)+lnD(xs[1],bot,xs[1],bot+24)+lnD(x,bot,x,bot+24)+lnD(x+HF.w,bot,x+HF.w,bot+24)+
    hdim(x,xs[0],bot+18,e)+hdim(xs[1],x+HF.w,bot+18,e);}
  let yb=bot+44;
  (extra||[]).forEach(f=>{const r=f(x,top,bot,sx,sl,yb);s+=r.s;yb=r.yb;});
  s+=T(cx,yb+6,"▼ spodní konec",{anchor:"middle",fs:13,w:1});
  return {s,yb:yb+6};
}
// K09: díry Ø 8 pro K10 (X23) v pravé straně u spodního konce
const x23extra=(x,top,bot,sx,sl,yb)=>{
  const col="#1F4E8C", y=bot-t/2*sl; let s='';
  DW.x23.forEach(v=>s+='<circle cx="'+(x+v*sx)+'" cy="'+y+'" r="5" fill="#fff" stroke="'+col+'" stroke-width="2.5"/>');
  DW.x23.forEach((v,i)=>{const yy=yb+i*26;s+=lnD(x+v*sx,bot,x+v*sx,yy+4)+hdim(x,x+v*sx,yy,v,col);});
  s+=lnD(x,bot,x,yb+60);
  s+=T(x+HF.w+8,yb+6,"Ø 8 pro K10:",{fs:13,w:1,fill:col})+T(x+HF.w+8,yb+22,"střed 9,5 od spodu",{fs:13,fill:col})+T(x+HF.w+8,yb+38,"od čela, hl. "+DW.x23_hole,{fs:13,fill:col});
  return {s,yb:yb+DW.x23.length*26+6};
};
function figHoles(p){
  const faces=[1,0].filter(f=>pinHoles(p.id,f).length);   // levá vlevo, pravá vpravo
  const Lpx=Math.max(p.L*HF.k,HF.min), top=114;
  const n=faces.map(f=>pinHoles(p.id,f).length);
  const extra=p.id==="K09"?[x23extra]:null;
  let s='', yb=0, VB;
  if(faces.length===2){
    const xl=30+n[0]*HF.step, xr=xl+HF.w+60;
    const a=holeFace(p,1,xl,top,Lpx), b=holeFace(p,0,xr,top,Lpx);
    s=a.s+b.s; yb=Math.max(a.yb,b.yb); VB=xr+HF.w+22+n[1]*HF.step+10;
  }else{
    const f=faces[0], x=f===1?30+n[0]*HF.step:20;
    const a=holeFace(p,f,x,top,Lpx,extra); s=a.s; yb=a.yb; VB=x+HF.w+(f===0?22+n[0]*HF.step:0)+(extra?140:10);
  }
  VB=Math.max(VB,300);
  const head=T(10,22,p.id+" · "+esc(p.name),{fs:17,w:1})+T(10,40,"délka "+nf(p.L)+" mm",{fs:14});
  const cnt=faces.reduce((a,f)=>a+2*pinHoles(p.id,f).length,0)+(p.id==="K09"?DW.x23.length:0);
  return fig(svgw("0 0 "+VB+" "+(yb+14),head+s,"Díry v "+p.id).replace("<svg ",'<svg style="max-width:'+VB+'px;margin:0 auto" '),
    cnt+" děr. Čísla podél dílu = výška středu díry od <b>spodního konce</b>, dole = vzdálenost od bližší hrany (čelo / zeď). Kolíky Ø "+KO.d+", hloubka "+KO.hole+". Délka dílu není v měřítku.");
}
// díry 8 × 35 v K07 (horní plocha), K08 (spodní čelo) a K10 (levé čelo)
function figDowels(){
  const col="#1F4E8C", c=(x,y)=>'<circle cx="'+x+'" cy="'+y+'" r="5" fill="#fff" stroke="'+col+'" stroke-width="2.5"/>';
  const ax=PBY.K08.x0-PBY.K07.x0+9.5, L7=PBY.K07.L;
  // K07 shora: délka vodorovně, čelo dole
  const k=400/L7, x0=40, y0=80, h7=D*0.5, sy=h7/D, hx=x0+ax*k;
  let s=T(10,22,"Díry Ø 8 pro kolíky 8 × 35",{fs:17,w:1});
  s+=T(x0,y0-30,"K07 shora (horní plocha), hloubka "+DW.x21_hole,{fs:14,w:1});
  s+='<rect x="'+x0+'" y="'+y0+'" width="'+(L7*k)+'" height="'+h7+'" '+WOOD2+'/>';
  s+=T(x0+4,y0+h7-6,"čelo",{fs:12,fill:"#6B4A2E"})+T(x0+4,y0+14,"zeď",{fs:12,fill:"#6B4A2E"});
  const ys=DW.x21.map(v=>y0+h7-v*sy);
  ys.forEach(y=>s+=c(hx,y));
  s+=lnD(x0,y0,x0,y0-12)+lnD(hx,ys[1],hx,y0-12)+hdim(x0,hx,y0-8,"")+T((x0+hx)/2,y0-12,nf(ax)+" od levého konce",{anchor:"middle",fs:13,w:1,fill:col});
  s+=lnD(hx,ys[0],hx+70,ys[0])+lnD(hx,ys[1],hx+70,ys[1]);
  s+=vdim(hx+60,y0+h7,ys[0],DW.x21[0],col)+vdim(hx+60,y0,ys[1],D-DW.x21[1],col);
  s+=lnD(x0+L7*k,y0+h7,hx+70,y0+h7)+lnD(x0+L7*k,y0,hx+70,y0);
  // čela K08 a K10: 250 × 19, měřítko 1,6
  const ends=[["K08 spodní čelo (2 díry, hloubka "+(DW.L-DW.x21_hole+1)+")",DW.x21],["K10 levé čelo (3 díry, hloubka "+(DW.L-DW.x23_hole+1)+")",DW.x23]];
  let y=y0+h7+60; const ke=1.6;
  ends.forEach(([lab,pos])=>{
    s+=T(x0,y,lab,{fs:14,w:1});
    const ry=y+12, rh=t*ke;
    s+='<rect x="'+x0+'" y="'+ry+'" width="'+(D*ke)+'" height="'+rh+'" '+WOOD2+'/>';
    s+=T(x0-4,ry+rh-4,"čelo",{fs:12,fill:"#6B4A2E",anchor:"end"})+T(x0+D*ke+4,ry+rh-4,"zeď",{fs:12,fill:"#6B4A2E"});
    pos.forEach(v=>s+=c(x0+v*ke,ry+rh/2));
    pos.forEach((v,i)=>{const yy=ry+rh+16+i*26;s+=lnD(x0+v*ke,ry+rh,x0+v*ke,yy+4)+hdim(x0,x0+v*ke,yy,v,col);});
    s+=lnD(x0,ry+rh,x0,ry+rh+16+pos.length*26-18);
    y=ry+rh+16+pos.length*26+30;
  });
  s+=T(x0,y-10,"Díry v čelech jsou uprostřed tloušťky (9,5 mm). Kóty jsou od čela.",{fs:13});
  return fig(svgw("0 0 "+HF.VB+" "+y,s,"Díry pro kolíky 8 × 35"),
    "X21: K07 nahoře + K08 dole, X23: K10 levé čelo + K09 pravá strana (K09 viz jeho výkres výš). Nejdřív vrtej do čela, protějšek označ značkovacími hroty.");
}

    if(ids.includes("K20"))steps.push("<b>Boční díl mostu K20</b> přišroubuj do pravé stěny (sádrokarton, kovové hmoždinky, ideálně do profilu), spodní konec v rovině spodku dna mostu, tedy "+nf(PBY.K20.z0)+" mm nad podlahou. Výšku <b>přenes vodováhou od K04</b>, ne metrem od podlahy. Čelo v rovině s K04. <b>Vodorovně:</b> nejdřív přišroubuj úhelníky X49 na K04 (viz bod Dno mostu), polož na něj K24 nasucho a K20 přisaď k jejímu pravému konci; šířku stěny ve výšce 2,2 m změř předem. Díry pro kolíky už má z dílny.");
    if(ids.some(id=>/Dno mostu/.test(PBY[id].name)))steps.push("<b>Dno mostu K24:</b> nejdřív na pravou plochu K04 přišroubuj 2 úhelníky (X49): <b>větší (50–60 mm) vzadu u zdi, menší (20–30 mm) vpředu asi 40 mm za čelem</b>, horní hrany přesně ve výšce spodku K24 (stejná jako spodek K23 vlevo, přenes vodováhou, oba úhelníky na jednu čáru). Polož na ně K24, pravý konec u K20 (spodek K24 v rovině spodního konce K20). Zespodu přišroubuj K24 do obou úhelníků na K04, pak v přihrádce shora 2 úhelníky do levé plochy K20 a horní plochy K24 (X51), zase větší vzadu a menší vpředu. Úhelníky natři bíle jako zeď. Do zadní stěny se K24 nekotví (X50 zrušen).");
    const placed=shelves.filter(id=>id==="K14"||id==="K18"); if(placed.length)steps.push("<b>"+placed.join(" a ")+"</b> už leží na kolících od kroku 6 (rozpěrky), jen zkontroluj, že sedí v drážkách.");

      steps.push("<b>"+sid+"</b> hned po položení přišroubuj <b>shora skrz polici</b> do čela "+q.id+" pod ní (spoj A"+(jj?", "+jj.id:"")+"): čela srovnej k lati, předvrtej 3 mm skrz polici do "+q.id+", polici převrtej 5 mm, zahlub a 2 vruty 4,5 × 50, hlavy pod povrch (stojí na nich další díl). Musí to být dřív, než na "+sid+" postavíš další díl. Přihrádka má jen ~325 mm na výšku: kompaktní vrtačka nebo úhlový nástavec"+(sid==="K14"?", K18 nad ní dočasně vyndej":"")+".");}));
    verts.filter(id=>id!=="K09"&&id!=="K20").forEach(id=>{const p=PBY[id];
      if(/kolíky 8 × 35/.test(p.ends[0]))steps.push("<b>"+id+"</b>: do děr v horní ploše K07 vlep 2 kolíky 8 × 35 (lepidlo D3, spoj X21) a K08 na ně nasaď, přesně nad K03, čelo k lati. Nahoře ho pak drží vruty skrz K14.");
      else if(/úhelník vzadu v přihrádce/.test(p.ends[0]))steps.push("<b>"+id+"</b> postav na "+/na (K\d+)/.exec(p.ends[0])[1]+", čelo k lati, a přichyť <b>úhelníkem vzadu</b> v přihrádce do jeho horní plochy (spoj X52). <b>Vodorovně:</b> levou plochou "+nf(p.x0)+" mm od obkladu.");

      else if(/zespodu/.test(p.ends[0])){const base=/na (K\d+)/.exec(p.ends[0])[1], sp=MAIN.filter(q=>q.o==="H"&&q.ends.some(e=>new RegExp("v boku dílu "+id+"\\b").test(e))), lv=sp.length?Math.min(...sp.map(q=>q.za0)):null, sp1=sp.filter(q=>q.za0===lv).map(q=>q.id);
        steps.push("<b>"+id+"</b> postav na "+base+", čelo k lati. <b>Vodorovná poloha:</b> levou plochou "+nf(p.x0)+" mm od obkladu"+(sp1.length?". Police vedle ("+sp1.join(" a ")+") mají vůli jen 1 mm, takže polohu urči tak, že je vložíš nasucho na kolíky jako distanční, ":", ")+"stáhni svěrkou a <b>zespodu přes polici</b> předvrtej a zašroubuj 2 vruty (spoj A).");}
      if(/úhelník vzadu/.test(p.ends[1]))steps.push(id+" nahoře přichyť úhelníkem do zadní stěny (přes sádrokarton do dřeva).");
    });
    if(ids.includes("K26"))steps.push("<b>Horní deska K26</b> jako poslední: zasuň zepředu o pár mm výš nad svislými díly a nad kolíky v K20, pak ji spusť: vlevo dolehne na K09, vpravo kolíky v K20 zapadnou do drážek. <b>Dotlač ji vpravo až ke K20</b> (u obkladu zůstane mezera 5 mm), jinak by kolíky zapadly jen napůl. Zespodu přichyť úhelníky u zadní hrany ke všem svislým dílům pod ní.");

    if(x+w>maxW){x=10;y+=rowH+34;rowH=0;}
    s+='<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+(LOC[st.loc]||"#E4C896")+'" stroke="#6B5536" stroke-width="1"/>'+
      T(x,y+h+14,st.id+" · "+nf(st.L)+"×"+nf(st.Wd),{fs:12});
    const items=st.strips.flatMap(q=>q.items);
    s+=T(x+4,y+13,items.join(" "),{fs:11,fill:"#2B2118"});
    x+=w+gap; rowH=Math.max(rowH,h);
  });
  return svgw("0 0 "+(maxW+20)+" "+(y+rowH+30),s,"Desky z půdy v měřítku");
}
function cutPlans(){
  const S=Object.values(DATA.stock).sort((a,b)=>LOC_ORDER.indexOf(a.loc)-LOC_ORDER.indexOf(b.loc)||a.id.localeCompare(b.id,"cs",{numeric:true}));
  const sc=.27;
  return S.map(s=>{
    const pad=16, top=46, vw=s.L+2*pad, vh=s.Wd+top+pad, hid="h"+s.id.replace(/\W/g,"");
    let g='<defs><pattern id="'+hid+'" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="18" stroke="#C9B38E" stroke-width="3"/></pattern></defs>'+
      '<rect x="0" y="0" width="'+s.L+'" height="'+s.Wd+'" fill="#F3E6CF"/><rect x="0" y="0" width="'+s.L+'" height="'+s.Wd+'" fill="url(#'+hid+')"/><rect x="0" y="0" width="'+s.L+'" height="'+s.Wd+'" fill="none" stroke="#9C7A48" stroke-width="3"/>'+
      '<text x="0" y="-14" font-family="'+LBL+'" font-size="44" fill="#65686C">léta ⟷</text>';
    s.strips.forEach(st=>st.items.forEach(pid=>{const p=PBY[pid], w=p.cutL||p.L, h=p.cutB||p.B, x=p.off, y=st.y;
      const fs=Math.min(58,Math.max(28,Math.min(h,w)*.24)), fd=Math.min(46,Math.max(26,Math.min(h,w)*.19));
      g+='<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+(LOC[s.loc]||"#E4C896")+'" stroke="#6B5536" stroke-width="3"/>';
      for(let k=1;k<4;k++)g+='<line x1="'+(x+8)+'" x2="'+(x+w-8)+'" y1="'+(y+h*k/4)+'" y2="'+(y+h*k/4)+'" stroke="#6B5536" stroke-opacity=".18" stroke-width="3"/>';
      // délka (po letech) u horní hrany, šířka u levé hrany
      g+='<text x="'+(x+w/2)+'" y="'+(y+fd+6)+'" text-anchor="middle" font-family="'+LBL+'" font-size="'+fd+'" fill="#2B2118" stroke="#FBFAF7" stroke-width="7" paint-order="stroke">'+nf(w)+'</text>';
      const lx=x+fd*.9+6, ly=y+h/2;
      g+='<text x="'+lx+'" y="'+ly+'" text-anchor="middle" font-family="'+LBL+'" font-size="'+fd+'" fill="#2B2118" stroke="#FBFAF7" stroke-width="7" paint-order="stroke" transform="rotate(-90 '+lx+' '+ly+')">'+nf(h)+'</text>';
      g+='<text x="'+(x+w/2+fd*.4)+'" y="'+(y+h/2+fs*.55)+'" text-anchor="middle" font-family="'+LBL+'" font-size="'+fs+'" font-weight="600" fill="#2B2118">'+pid+'</text>';}));
    return '<div class="sk"><div class="h"><b>'+esc(s.id)+'</b> '+nf(s.L)+' × '+nf(s.Wd)+(s.vady?' · '+esc(s.vady):'')+'</div><svg viewBox="'+(-pad)+' '+(-top)+' '+vw+' '+vh+'" width="'+Math.round(vw*sc)+'" height="'+Math.round(vh*sc)+'" role="img" aria-label="Plán řezu '+esc(s.id)+'">'+g+'</svg></div>';
  }).join("");
}

/* ---------- navigation ---------- */
const nav=document.getElementById("nav"), main=document.getElementById("step");
let cur=0;
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(e){return null;}}
nav.innerHTML=STEPS.map((s,i)=>'<button type="button" data-i="'+i+'"><b>'+(i+1)+'</b>'+esc(s.short)+'</button>').join("");
function show(i,focus){
  cur=Math.max(0,Math.min(STEPS.length-1,i));
  const s=STEPS[cur];
  main.innerHTML='<div class="stephead"><div class="eyebrow">Krok '+(cur+1)+' z '+STEPS.length+'</div><h2>'+esc(s.title)+'</h2></div>'+s.render();
  nav.querySelectorAll("button").forEach((b,k)=>{b.toggleAttribute("aria-current",k===cur);if(k===cur)b.setAttribute("aria-current","step");b.classList.toggle("done",k<cur);});
  const b=nav.querySelector('[data-i="'+cur+'"]'); if(b&&b.scrollIntoView)b.scrollIntoView({block:"nearest",inline:"center"});
  document.getElementById("prev").disabled=cur===0; document.getElementById("next").disabled=cur===STEPS.length-1;
  document.getElementById("prev").textContent=cur>0?"← "+(cur)+". "+STEPS[cur-1].short:"← Předchozí";
  document.getElementById("next").textContent=cur<STEPS.length-1?(cur+2)+". "+STEPS[cur+1].short+" →":"Další →";
  if(location.hash!=="#krok-"+(cur+1))history.replaceState(null,"","#krok-"+(cur+1));
  store("postup-krok",String(cur));
  main.querySelectorAll("input[type=checkbox][data-k]").forEach(c=>{c.checked=store(c.dataset.k)==="1";c.closest("label").classList.toggle("on",c.checked);
    c.addEventListener("change",()=>{store(c.dataset.k,c.checked?"1":"0");c.closest("label").classList.toggle("on",c.checked);});});
  if(focus){window.scrollTo({top:0});main.focus({preventScroll:true});}
}
nav.addEventListener("click",e=>{const b=e.target.closest("button[data-i]");if(b)show(+b.dataset.i,true);});
document.getElementById("prev").addEventListener("click",()=>show(cur-1,true));
document.getElementById("next").addEventListener("click",()=>show(cur+1,true));
document.addEventListener("keydown",e=>{if(e.target.closest("input,textarea"))return;if(e.key==="ArrowRight")show(cur+1,true);if(e.key==="ArrowLeft")show(cur-1,true);});
const m=/#krok-(\d+)/.exec(location.hash);
show(m?+m[1]-1:(+store("postup-krok")||0),false);
})();
</script>
